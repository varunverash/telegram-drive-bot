name: Telegram Drive Bot

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: telegram-drive-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore Telegram session
        env:
          TELEGRAM_SESSION_B64: ${{ secrets.TELEGRAM_SESSION_B64 }}
        run: |
          echo "$TELEGRAM_SESSION_B64" | base64 -d | gzip -d > drive_bot_session.session
          chmod 600 drive_bot_session.session

      - name: Verify Telegram session
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          python - <<'PY'
          import os
          from telethon.sync import TelegramClient

          client = TelegramClient(
              "drive_bot_session",
              int(os.environ["TELEGRAM_API_ID"]),
              os.environ["TELEGRAM_API_HASH"],
          )

          client.connect()

          print("Session file exists:", os.path.exists("drive_bot_session.session"))
          print("Session file size:", os.path.getsize("drive_bot_session.session"))
          print("Authorized:", client.is_user_authorized())

          if client.is_user_authorized():
              me = client.get_me()
              print("Telegram account:", me.id)
              print("Telegram username:", getattr(me, "username", None))

          client.disconnect()
          PY

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python bot.py
